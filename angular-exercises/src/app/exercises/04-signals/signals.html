<!-- Exercise 4 — Signals -->
<section class="exercise">
  <h2>Signal Counter</h2>

  <!-- TODO 8: Display count() — note: signals are called like functions in templates -->
  <p>Count: <strong>{{count()}}</strong></p>

  <!-- TODO 9: Display the doubled computed signal -->
  <p>Doubled: <strong> {{ doubled() }}</strong></p>

  <!-- TODO 10: Display isEven — show "Even" or "Odd" using @if -->
@if (isEven()) {
  <p>Even</p>
} @else {
  <p>Odd</p>
}

  <div class="controls">
    <!-- TODO 11: Wire up the three buttons -->
    <button (click)="decrement()">-</button>
    <button (click)="reset()">Reset</button>
    <button (click)="increment()">+</button>
  </div>

  <!-- Bonus: Open DevTools console and watch the effect() log as count changes -->
</section>
