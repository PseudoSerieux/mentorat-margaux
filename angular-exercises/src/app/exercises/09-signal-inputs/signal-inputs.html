<!-- Exercise 9 — Signal Inputs & Outputs -->
<section class="exercise">
  <h2>Signal Inputs & Outputs</h2>

  <!--
    TODO 9: Loop over names() and render a <app-greeting-card> for each.

    @for (name of names(); track name) {
      <app-greeting-card
        [name]="name"
        greeting="Good to see you!"
        (dismissed)="onDismiss(name)"
      />
    }

    Note: [name]="name" binds to the input() signal.
    (dismissed)="..." listens to the output() event.
  -->
    @for (name of names(); track name) {
      <app-greeting-card
        [name]="name"
        greeting="Good to see you!"
        (dismissed)="onDismiss(name)"
      />
    }
    
  @if (dismissed().length > 0) {
    <p>Dismissed: {{ dismissed().join(', ') }}</p>
  }

  <p><em>Add app-greeting-card components above!</em></p>
</section>
