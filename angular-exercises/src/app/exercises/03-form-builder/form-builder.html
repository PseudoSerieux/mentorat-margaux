<!-- Exercise 3 — Typed FormBuilder & Reactive Forms -->
<section class="exercise">
  <h2>Login Form</h2>

  <!-- TODO 5: Bind this form to your loginForm using [formGroup]="loginForm" -->
  <!-- TODO 6: Add (ngSubmit)="onSubmit()" to the form tag -->
  <form>
    <div>
      <label for="email">Email</label>
      <!-- TODO 7: Add formControlName="email" to this input -->
      <input id="email" type="email" placeholder="you@example.com" />
      <!-- TODO 8: Show a validation error when email is invalid and touched -->
      <!-- Hint: loginForm.get('email')?.invalid && loginForm.get('email')?.touched -->
    </div>

    <div>
      <label for="password">Password</label>
      <!-- TODO 9: Add formControlName="password" to this input -->
      <input id="password" type="password" placeholder="Min 6 characters" />
    </div>

    <!-- TODO 10: Disable the button when the form is invalid -->
    <!-- Hint: [disabled]="loginForm.invalid" -->
    <button type="submit">Login</button>
  </form>

  <!-- TODO 11: Show form value for debugging: {{ loginForm.value | json }} -->
  <!-- TODO 12: Show form status: {{ loginForm.status }} -->
</section>
